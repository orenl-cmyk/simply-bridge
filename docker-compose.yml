name: simply-bridge

services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BRIDGE_IMAGE:-simply-bridge:0.24.1}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_IP:-127.0.0.1}:${HOST_PORT:-4318}:4318"
    environment:
      HOST: 0.0.0.0
      PORT: "4318"
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:4318/}
      DATA_DIR: /app/data
    volumes:
      - bridge_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  bridge_data:
    name: ${DATA_VOLUME:-simply-bridge-data}
