name: Build offline Docker package

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/0.23.0-offline', 'feature/relation-finalizer-024']
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: offline-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name != 'feature/relation-finalizer-024'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, test and package Linux AMD64
        env:
          PLATFORM: linux/amd64
        run: bash deploy/build-offline.sh
      - name: Collect installation package
        run: |
          mkdir -p artifact
          cp bridge-release-*/simply-bridge-*-BLACK-FRESH-INSTALL.zip artifact/
          cp bridge-release-*/simply-bridge-*-RED-UPDATE.zip artifact/
          cd artifact
          sha256sum *.zip > SHA256SUMS.txt
      - name: Upload installation package
        uses: actions/upload-artifact@v4
        with:
          name: simply-bridge-linux-amd64-offline
          path: artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  build-024-image:
    if: github.ref_name == 'feature/relation-finalizer-024'
    uses: ./.github/workflows/docker-image-024.yml
    permissions:
      contents: read
