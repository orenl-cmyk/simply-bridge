name: Build Simply Bridge 0.24.1 image TAR and ZIP

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_VERSION: 0.24.1
      NODE_VERSION: 22.23.5
      IMAGE: simply-bridge:0.24.1
      CURRENT_IMAGE: simply-bridge:current
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5

      - name: Verify source, Node and SQLite versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/feature/relation-finalizer-024"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(node -p "require('./package.json').version")" = "$APP_VERSION"
          node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const db=new DatabaseSync(':memory:'); db.exec('CREATE TABLE probe(value TEXT); INSERT INTO probe VALUES (\"sqlite-ready\")'); if(db.prepare('SELECT value FROM probe').get().value!=='sqlite-ready') process.exit(1); db.close();"
          grep -F "ARG NODE_IMAGE=node:${NODE_VERSION}-bookworm-slim" Dockerfile
          grep -F '"node": ">=22.13.0"' package.json
          grep -F "simply-bridge:${APP_VERSION}" deploy/compose.yaml

      - name: Run source regression suite
        env:
          NODE_USE_ENV_PROXY: "0"
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image
        run: >-
          docker buildx build
          --platform linux/amd64
          --build-arg NODE_IMAGE=node:${NODE_VERSION}-bookworm-slim
          --tag "$IMAGE"
          --load .

      - name: Verify image version, architecture, Node and SQLite
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = 'linux/amd64'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE")" = "$APP_VERSION"
          docker run --rm --entrypoint node "$IMAGE" -e "const assert=require('node:assert/strict'); assert.equal(process.version,'v${NODE_VERSION}'); assert.equal(require('/app/package.json').version,'${APP_VERSION}');"
          docker run --rm --entrypoint node "$IMAGE" --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const db=new DatabaseSync(':memory:'); db.exec('CREATE TABLE probe(value TEXT); INSERT INTO probe VALUES (\"sqlite-ready\")'); if(db.prepare('SELECT value FROM probe').get().value!=='sqlite-ready') process.exit(1); db.close();"
          docker image inspect --format '{{json .Config.Volumes}}' "$IMAGE" | grep -F '"/app/data"'

      - name: Run regression suite with packaged Node runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --tmpfs /work:uid=1000,gid=1000 \
            --volume "$GITHUB_WORKSPACE/test:/app/test:ro" \
            --env NODE_USE_ENV_PROXY=0 \
            --entrypoint node "$IMAGE" \
            --test --test-concurrency=1 '/app/test/*.test.mjs'

      - name: Smoke test container health
        shell: bash
        run: |
          set -euo pipefail
          name="simply-bridge-smoke-${GITHUB_RUN_ID}"
          volume="simply-bridge-smoke-data-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --detach --name "$name" \
            --env PUBLIC_URL=http://127.0.0.1:4318/ \
            --volume "$volume:/app/data" "$IMAGE" >/dev/null
          for attempt in $(seq 1 45); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$name")"
            if [ "$health" = healthy ]; then
              docker exec "$name" node /app/deploy/healthcheck.mjs
              exit 0
            fi
            if [ "$health" = unhealthy ]; then
              docker logs "$name" >&2
              exit 1
            fi
            sleep 1
          done
          docker logs "$name" >&2
          exit 1

      - name: Create one image TAR and SHA256
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          docker tag "$IMAGE" "$CURRENT_IMAGE"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$(docker image inspect --format '{{.Id}}' "$CURRENT_IMAGE")"
          tar="simply-bridge-${APP_VERSION}-linux-amd64.tar"
          docker image save --output "artifact/$tar" "$IMAGE" "$CURRENT_IMAGE"
          python3 - "artifact/$tar" "$APP_VERSION" <<'PY'
          import json, sys, tarfile
          with tarfile.open(sys.argv[1]) as archive:
              manifest = json.load(archive.extractfile('manifest.json'))
          assert len(manifest) == 1, f'Expected one image, found {len(manifest)}'
          assert set(manifest[0]['RepoTags']) == {f'simply-bridge:{sys.argv[2]}', 'simply-bridge:current'}
          PY
          (cd artifact && sha256sum "$tar" > "$tar.sha256" && sha256sum --check "$tar.sha256")
          cp deploy/compose.yaml artifact/compose.yaml
          cp deploy/INSTALL-PODMAN-CMD.txt artifact/INSTALL-PODMAN-CMD.txt
          zip="simply-bridge-${APP_VERSION}-linux-amd64.zip"
          (cd artifact && zip -0 -j "$zip" "$tar" "$tar.sha256" compose.yaml INSTALL-PODMAN-CMD.txt)
          (cd artifact && sha256sum "$zip" > "$zip.sha256" && sha256sum --check "$zip.sha256")
          sha="$(cut -d ' ' -f 1 "artifact/$tar.sha256")"
          printf 'sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Simply Bridge ${APP_VERSION} Docker image"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo '- Platform: \`linux/amd64\`'
            echo "- Node: \`v${NODE_VERSION}\`"
            echo "- TAR: \`$tar\`"
            echo "- SHA256: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: simply-bridge-0.24.1-linux-amd64
          path: |
            artifact/simply-bridge-0.24.1-linux-amd64.tar
            artifact/simply-bridge-0.24.1-linux-amd64.tar.sha256
            artifact/simply-bridge-0.24.1-linux-amd64.zip
            artifact/simply-bridge-0.24.1-linux-amd64.zip.sha256
            artifact/compose.yaml
            artifact/INSTALL-PODMAN-CMD.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
